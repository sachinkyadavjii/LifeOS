function timeValue(id){let raw=document.getElementById(id).value.trim(),m=raw.match(/^(\d{1,2}):(\d{2})$/);if(!m)return '';let h=+m[1],min=+m[2];if(min>59)return '';if((state.settings.timeFormat||'12')==='24'){if(h>23)return '';return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0')}let ap=document.getElementById(id+'ampm').value;if(h<1||h>12)return '';h=h%12+(ap==='PM'?12:0);return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0')}function showTime(value){if(!value||(state.settings.timeFormat||'12')==='24')return value||'';let [h,m]=value.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM')}function selectField(label,id,opts,selected=''){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}function card(title,content,extra=''){return `<section class="card ${extra}"><h2>${title}</h2>${content}</section>`}function getChecks(d=today()){return state.checks[d]||{}}function activeHabits(){return state.habits.filter(h=>h.active!==false)}function habitCounts(d=today()){let list=activeHabits().filter(h=>!h.days||h.days.includes(new Date(d+'T12:00:00').getDay()));let c=getChecks(d);return {total:list.reduce((s,h)=>s+(+h.weight||1),0),done:list.reduce((s,h)=>s+(c[h.id]?.done?(+h.weight||1):0),0),list}}function studyHours(d=today()){return (state.tasks||[]).filter(t=>t.date===d&&t.status==='Done').reduce((s,t)=>s+(+t.actual||0),0)+(state.blocks[d]||[]).filter(b=>b.category==='Study'&&b.status==='Completed').reduce((s,b)=>s+(+b.actual||b.duration||0)/60,0)}function mealDone(d=today()){return state.meals.filter(m=>m.date===d&&m.followed).length}function workoutDone(d=today()){return state.workouts.some(w=>w.date===d&&w.status==='Completed')}function sleepHours(d=today()){let s=state.sleeps.find(x=>x.date===d);return s?+s.duration:0}function score(d=today()){let w=state.settings.weights;let h=habitCounts(d),ha let inds=earned.map((v,i)=>v===null?null:i).filter(x=>x!==null),den=inds.reduce((s,i)=>s+(+w[i]||0),0);let pts=earned.reduce((s,x)=>s+(x||0),0);return {points:den?Math.round(pts*100/den):0,earned,den,complete:den>=100,provisional:den>0&&den<100,parts:[hasH,hasStudy,hasWo,hasMeal,hasSleep]}}

function render(){document.getElementById('pagetitle').textContent=page;const greeting=new Date().getHours()<12?'Good morning':new Date().getHours()<18?'Good afternoon':'Good evening';let c=document.getElementById('content');let views={'Overview':overview,'My Day':myday,'Daily Score':dailyscore,'Habit Tracker':habits,'Diet Tracker':diet,'Workout Tracker':workouts,'Study & Productivity':study,'Sleep & Recovery':sleep,'Analytics & Reports':analytics,'Goals & Achievements':goals,'Settings & Data':settings};c.innerHTML=(views[page]||overview)()}
function overview(){let greeting=new Date().getHours()<12?'Good morning':new Date().getHours()<18?'Good afternoon':'Good evening';let s=score(),hc=habitCounts(),todayBlocks=state.blocks[today()]||[],streak=calcStreak(),wc=state.workouts.some(w=>w.date===today()&&w.status==='Completed'),mealN=mealDone(),sh=studyHours(),sl=sleepHours();let vals=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=dateKey(d);vals.push({d:k,label:d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2),score:dayHasData(k)?dayScore(k):null})}let valid=vals.filter(x=>x.score!==null),avg=valid.length?Math.round(valid.reduce((a,x)=>a+x.score,0)/valid.length):0,high=valid.length?Math.max(...valid.map(x=>x.score)):'—',low=valid.length?Math.min(...valid.map(x=>x.score)):'—';let circ=2*Math.PI*56,offset=circ*(1-s.points/100);let habitsHTML=hc.list.slice(0,6).map(h=>`<div class="habit-item"><button class="check ${getChecks()[h.id]?.done?'done':''}" onclick="toggleHabit('${h.id}')">${getChecks()[h.id]?.done?'✓':''}</button><span class="habit-name">${esc(h.name)}</span><span class="habit-streak">🔥 ${calcHabitStreak(h.id)}</span></div>`).join('')||'<div class="empty">Create a habit to begin tracking</div>';let bars=vals.map(x=>`<div class="col"><span class="value">${x.score===null?'·':x.score}</span><div class="stick" style="height:${x.score===null?3:Math.max(4,x.score)}%"></div><span class="day">${x.label}</span></div>`).join('');let heat=heatmapCells();return `<div class="eyebrow">${greeting} · ${fmt(today())}</div><div class="grid stats"><div class="card stat" style="--glow:var(--cyan)"><div class="stat-label">Daily score</div><div class="stat-value">${s.den?s.points:'—'}<span class="muted" style="font-size:14px"> / 100</span></div><div class="stat-sub">${s.den?(s.complete?'Finalized':'Provisional · '+Math.round(s.den)+'% logged'):'Log activity to calculate'}</div></div><div class="card stat" style="--glow:var(--purple)"><div class="stat-label">Habits complete</div><div class="stat-value">${hc.done}<span class="muted" style="font-size:14px"> / ${hc.total}</span></div><div class="stat-sub">Today's scheduled habits</div></div><div class="card stat" style="--glow:var(--blue)"><div class="stat-label">Study time</div><div class="stat-value">${sh.toFixed(1)}<span class="muted" style="font-size:14px"> hrs</span></div><div class="stat-sub">Target ${state.settings.studyTarget} hours</div></div><div class="card stat" style="--glow:var(--green)"><div class="stat-label">Current streak</div><div class="stat-value">${streak}<span class="muted" style="font-size:14px"> days</span></div><div class="stat-sub">Consecutive days with tracking</div></div></div><div class="grid dashboard-grid"><section class="card score-card"><h2>Daily performance</h2><div class="score-main"><div class="ring"><svg viewBox="0 0 128 128"><defs><linearGradient id="grad"><stop stop-color="#628bff"/><stop offset="1" stop-color="#55e1f2"/></linearGradient></defs><circle class="track" cx="64" cy="64" r="56"/><circle class="progress" cx="64" cy="64" r="56" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/></svg><div class="ring-label"><strong>${s.den?s.points:'—'}</strong><span>OUT OF 100</span></div></div><div class="score-meta"><strong>${s.den?scoreLabel(s.points):'Ready when you are'}</strong><p>${s.complete?'Complete report · score reflects all categories.':s.den?'Provisional score · more logs will fill in the remaining categories.':'Your score appears as you log habits, study, training, meals and sleep.'}</p><button class="btn small" onclick="go('Daily Score')">View breakdown →</button></div></div><div class="score-breakdown">${['Routine & habits','Study & work','Exercise','Diet adherence','Sleep & recovery'].map((n,i)=>`<div class="score-row"><span>${n}</span><span>${s.earned[i]===null?'Not logged':`${Math.round(s.earned[i])} / ${state.settings.weights[i]}`}</span></div><div class="bar"><i style="width:${s.earned[i]===null?0:100*s.earned[i]/state.settings.weights[i]}%"></i></div>`).join('')}</div></section>${card('Weekly score trend',`<div class="bars">${bars}</div><div class="chart-summary"><span>7-day avg <b>${valid.length?avg+' / 100':'—'}</b></span><span>High <b>${high}</b></span><span>Low <b>${low}</b></span></div><div class="muted" style="font-size:10px;margin-top:8px">${valid.length} days with saved data</div>`)}${card('Today’s habits',`<div class="habit-list">${habitsHTML}</div><button class="btn small" style="margin-top:12px" onclick="go('Habit Tracker')">Manage habits →</button>`)}${card('Consistency · 4 weeks',`<div class="heatmap">${heat}</div><div class="chart-summary"><span>Less <i style="color:#59667a">▪▪▪▪▪</i> More</span><button class="btn small" onclick="go('Analytics & Reports')">History →</button></div>`)}${card('Quick actions',`<div class="quick"><button class="btn" onclick="go('My Day')">＋ Time block</button><button class="btn" onclick="openMeal()">＋ Log meal</button><button class="btn" onclick="openWorkout()">＋ Log workout</button><button class="btn" onclick="go('Habit Tracker')">✓ Complete habit</button><button class="btn" onclick="go('Daily Score')">◎ Review score</button><button class="btn" onclick="go('Study & Productivity')">▤ Focus session</button></div>`)}${card('Today at a glance',`<div class="score-row"><span>Meals followed</span><b>${mealN} logged</b></div><div class="score-row"><span>Workout</span><b>${wc?'Complete':'Not logged'}</b></div><div class="score-row"><span>Last sleep</span><b>${sl?sl+' hrs':'Not logged'}</b></div><div class="score-row"><span>Time blocks</span><b>${todayBlocks.length}</b></div>`)}</div>`}
function calcHabitStreak(id){let n=0,d=new Date();for(let i=0;i<365;i++){let k=dateKey(d);let h=state.habits.find(x=>x.id===id);if(h?.days&&!h.days.includes(d.getDay())){d.setDate(d.getDate()-1);continue}if(getChecks(k)[id]?.done)n++;else break;d.setDate(d.getDate()-1)}return n}function calcStreak(){let n=0,d=new Date();for(let i=0;i<365;i++){let k=dateKey(d);if(dayHasData(k))n++;else break;d.setDate(d.getDate()-1)}return n}function heatmapCells(){let out='';for(let i=27;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=dateKey(d);let h=habitCounts(k);let v=Object.keys(getChecks(k)).length?Math.ceil(4*(h.total?h.done/h.total:0)):0;out+=`<div class="heat" data-v="${v}" title="${fmt(k)} · ${h.done}/${h.total} habits${dayHasData(k)?' · score '+dayScore(k):' · no data'}"></div>`}return out}
function toggleHabit(id){let c=getChecks();c[id]={done:!c[id]?.done,at:new Date().toISOString()};state.checks[today()]=c;save();render();toast(c[id].done?'Habit completed':'Habit unchecked')}function habits(){return `<div class="section-head"><h2>Build consistency, one day at a time</h2><button class="btn primary" onclick="openHabit()">＋ Add habit</button></div><div class="grid panelgrid">${card('Today',`<div class="habit-list">${activeHabits().map(h=>`<div class="habit-item"><button class="check ${getChecks()[h.id]?.done?'done':''}" onclick="toggleHabit('${h.id}')">${getChecks()[h.id]?.done?'✓':''}</button><span class="habit-name"><b>${esc(h.name)}</b><span class="muted" style="display:block;font-size:10px;margin-top:3px">${esc(h.category||'General')} · weight ${h.weight||1} · ${h.days?.length===7?'daily':(h.days||[]).map(d=>['Su','Mo','Tu','We','Th','Fr','Sa'][d]).join(' ')}</span></span><span class="habit-streak">🔥 ${calcHabitStreak(h.id)}</span><button class="icon-btn" onclick="editHabit('${h.id}')">✎</button><button class="icon-btn" onclick="deleteHabit('${h.id}')">×</button></div>`).join('')||'<div class="empty">No active habits yet. Add one to get started.</div>'}</div>`)}${card('Consistency snapshot',`<div class="weekdays">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}</div>${calendar(today())}<p class="muted" style="font-size:11px">Green days include habit completions. A habit’s streak skips days it wasn’t scheduled.</p>`)}${card('Habit history',`<div class="tablewrap"><table class="table"><thead><tr><th>Habit</th><th>Current streak</th><th>Best effort</th><th>Last 30 days</th></tr></thead><tbody>${activeHabits().map(h=>{let n=0,possible=0;for(let i=0;i<30;i++){let d=new Date();d.setDate(d.getDate()-i);if((h.days||[0,1,2,3,4,5,6]).includes(d.getDay())){possible++;if(getChecks(dateKey(d))[h.id]?.done)n++}}return `<tr><td>${esc(h.name)}</td><td>${calcHabitStreak(h.id)} days</td><td>${calcHabitStreak(h.id)} days</td><td>${possible?Math.round(n/possible*100):0}% · ${n}/${possible}</td></tr>`}).join('')}</tbody></table></div>`,'wide')}</div>`}function calendar(month){let d=new Date(month+'T12:00:00'),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),html='';for(let i=0;i<first;i++)html+='<div></div>';for(let i=1;i<=days;i++){let k=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,h=habitCounts(k),cl=Object.keys(getChecks(k)).length?(h.done?'done':'miss'):'';html+=`<div class="calday ${cl} ${k===today()?'today':''}" title="${h.done}/${h.total} habits">${i}</div>`}return `<div class="calendar">${html}</div>`}function openHabit(h){modal(h?'Edit habit':'New habit',`<div class="formrow">${field('Habit name','hname','text',h?.name||'')}${field('Category','hcat','text',h?.category||'Routine')}${field('Importance weight','hweight','number',h?.weight||1,'min="1" max="5"')}</div><div class="formrow">${field('Scheduled weekdays (0 Sun – 6 Sat)','hdays','text',(h?.days||[0,1,2,3,4,5,6]).join(','))}</div><div class="formrow"><button class="btn primary" onclick="saveHabit('${h?.id||''}')">Save habit</button></div>`)}function editHabit(id){openHabit(state.habits.find(h=>h.id===id))}function saveHabit(id){let name=document.getElementById('hname').value.trim();if(!name)return toast('Enter a habit name');let h={id:id||uid(),name,category:document.getElementById('hcat').value.trim(),weight:Math.max(1,+document.getElementById('hweight').value||1),days:document.getElementById('hdays').value.split(',').map(x=>+x.trim()).filter(x=>x>=0&&x<=6),active:true};let i=state.habits.findIndex(x=>x.id===id);if(i>=0)state.habits[i]=h;else state.habits.push(h);save();closeModal();render();toast('Habit saved')}function deleteHabit(id){if(confirm('Delete this habit and its check-in history?')){state.habits=state.habits.filter(h=>h.id!==id);Object.values(state.checks).forEach(c=>delete c[id]);save();render()}}
function myday(){let date=document.getElementById('daydate')?.value||today(),blocks=state.blocks[date]||[];return `<div class="section-head"><h2>Plan and review your 24 hours</h2><div class="top-actions"><input id="daydate" type="date" value="${date}" onchange="render()" style="width:auto"><button class="btn" onclick="loadRoutine()">Load routine</button><button class="btn primary" onclick="openBlock('${date}')">＋ Time block</button></div></div><div class="grid panelgrid"><section class="card wide"><h2>${fmt(date)} · ${blocks.length} planned blocks</h2><div class="timeline">${blocks.sort((a,b)=>a.start.localeCompare(b.start)).map(b=>`<div class="block"><span class="block-time">${showTime(b.start)}–${showTime(b.end)}</span><div><div class="block-title">${esc(b.activity)} <span class="tag">${esc(b.category)}</span></div><div class="block-sub">${b.duration} min planned${b.actual?` · ${b.actual} min actual`:''}${b.note?' · '+esc(b.note):''}</div></div><div><select onchange="blockStatus('${date}','${b.id}',this.value)" style="width:auto;padding:6px"><option ${b.status==='Planned'?'selected':''}>Planned</option><option ${b.status==='Completed'?'selected':''}>Completed</option><option ${b.status==='Partial'?'selected':''}>Partial</option><option ${b.status==='Missed'?'selected':''}>Missed</option><option ${b.status==='Rescheduled'?'selected':''}>Rescheduled</option></select> <button class="icon-btn" onclick="openBlock('${date}','${b.id}')">✎</button> <button class="icon-btn" onclick="removeBlock('${date}','${b.id}')">×</button></div></div>`).join('')||'<div class="empty">No blocks yet. Add a time block or load your editable starter routine.</div>'}</div></section>${card('Time allocation',allocation(date,blocks))}${card('Schedule adherence',`<div class="stat-value">${adherence(blocks)}%</div><div class="bar"><i style="width:${adherence(blocks)}%"></i></div><p class="muted" style="font-size:11px">Completed planned minutes ÷ total planned minutes. Breaks are simply a category, never marked as wasted.</p>`)}</div>`}function allocation(d,bs){let cat={};bs.forEach(b=>cat[b.category]=(cat[b.category]||0)+(+(b.actual||b.duration)||0));return Object.entries(cat).map(([k,v])=>`<div class="score-row"><span>${esc(k)}</span><b>${(v/60).toFixed(1)} hrs</b></div>`).join('')||'<div class="empty">No time logged yet</div>'}function adherence(bs){let total=bs.reduce((a,b)=>a+(+b.duration||0),0),done=bs.filter(b=>b.status==='Completed').reduce((a,b)=>a+(+b.duration||0),0);return total?Math.round(100*done/total):0}function openBlock(d,id){let b=(state.blocks[d]||[]).find(x=>x.id===id);modal(id?'Edit time block':'Add time block',`<div class="formrow">${field('Activity','bact','text',b?.activity||'')}${selectField('Category','bcat',['Sleep','Running','Workout','NGO / Work','Study','Meals','Personal development','YouTube recording','Video editing','Gaming','Entertainment','Travel','Personal tasks','Breaks','Other'],b?.category||'Study')}</div><div class="formrow">${timeField('Start','bstart',b?.start||'09:00')}${timeField('End','bend',b?.end||'10:00')}${field('Actual minutes','bactual','number',b?.actual||'')}</div><div class="formrow">${field('Note (optional)','bnote','text',b?.note||'')}</div><button class="btn primary" onclick="saveBlock('${d}','${id||''}')">Save block</button>`)}function saveBlock(d,id){let start=timeValue('bstart'),end=timeValue('bend'),activity=document.getElementById('bact').value.trim();if(!activity||!start||!end)return toast('Activity, start and end time are required');let mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b},dur=mins(end)-mins(start);if(dur<=0)return toast('End time must be after start time');let arr=state.blocks[d]||[],overlap=arr.find(x=>x.id!==id&&mins(start)<mins(x.end)&&mins(end)>mins(x.start));if(overlap)return toast(`Overlaps with ${overlap.activity} (${overlap.start}–${overlap.end})`);let obj={id:id||uid(),start,end,activity,category:document.getElementById('bcat').value,duration:dur,actual:+document.getElementById('bactual').value||0,note:document.getElementById('bnote').value,status:'Planned'};if(id){let i=arr.findIndex(x=>x.id===id);obj.status=arr[i]?.status||'Planned';arr[i]=obj}else arr.push(obj);state.blocks[d]=arr;save();closeModal();render();toast('Time block saved')}function blockStatus(d,id,val){let b=state.blocks[d].find(x=>x.id===id);b.status=val;if(val==='Completed'&&!b.actual)b.actual=b.duration;save();render()}function removeBlock(d,id){state.blocks[d]=state.blocks[d].filter(x=>x.id!==id);save();render()}function loadRoutine(){let d=document.getElementById('daydate')?.value||today();if((state.blocks[d]||[]).length&&!confirm('Replace this day’s time blocks with the starter routine?'))return;let r=[['04:30','04:45','Wake up','Personal tasks'],['04:45','05:30','Running','Running'],['05:30','06:00','Cool down and freshen up','Personal tasks'],['06:00','08:00','Study / personal development','Study'],['08:00','09:30','Breakfast, preparation and travel','Meals'],['09:30','14:00','NGO / work','NGO / Work'],['14:00','15:00','Travel, lunch and rest','Travel'],['15:00','17:00','Study','Study'],['17:00','18:00','Workout / personal tasks','Workout'],['18:00','20:00','Study / projects','Study'],['20:00','21:00','Dinner and personal time','Meals'],['21:00','22:00','Review and prepare tomorrow','Personal tasks'],['22:00','23:59','Sleep','Sleep']];state.blocks[d]=r.map(([start,end,activity,category])=>({id:uid(),start,end,activity,category,duration:(new Date('2000-01-01T'+end)-new Date('2000-01-01T'+start))/60000,status:'Planned',actual:0}));save();render();toast('Routine loaded · edit blocks to fit your day')}
function dailyscore(){let s=score(),cats=['Routine & habit completion','Study & productive work','Running & workout','Diet adherence','Sleep & recovery'],h=habitCounts(),meals=mealDone(),study=studyHours(),sl=sleepHours();let metrics=[`${h.done} / ${h.total} weighted habit marks`,`${study.toFixed(1)} hrs / ${state.settings.studyTarget} hr target`,workoutDone()?'Workout completed':'Workout not completed',`${meals} planned meals followed`,` ${sl||'—'} / ${state.settings.sleepTarget} hrs`];return `<div class="grid panelgrid"><section class="card"><div class="score-main"><div class="ring"><svg viewBox="0 0 128 128"><defs><linearGradient id="grad"><stop stop-color="#628bff"/><stop offset="1" stop-color="#55e1f2"/></linearGradient></defs><circle class="track" cx="64" cy="64" r="56"/><circle class="progress" cx="64" cy="64" r="56" stroke-dasharray="351.86" stroke-dashoffset="${351.86*(1-s.points/100)}"/></svg><div class="ring-label"><strong>${s.den?s.points:'—'}</strong><span>OUT OF 100</span></div></div><div><h2>${s.den?scoreLabel(s.points):'No score yet'}</h2><p class="muted">${s.complete?'Final score.':`Provisional · ${Math.round(s.den)} of 100 weighted marks have data.`}</p><button class="btn small" onclick="finalizeScore()">Save daily snapshot</button></div></div></section>${card('How today’s score is calculated',cats.map((n,i)=>`<div class="score-row"><span>${n}</span><b>${s.earned[i]===null?'Missing':`${s.earned[i].toFixed(1)} / ${state.settings.weights[i]}`}</b></div><div class="muted" style="font-size:10px;margin-bottom:8px">${metrics[i]}</div>`).join(''))}${card('Scoring rules',`<p class="muted" style="font-size:12px;line-height:1.7">Each category earns a proportional share of its configured weight. Study and sleep are capped at their targets. Exercise receives full marks when a logged session is completed. Diet uses up to three meals marked “followed.” Missing categories stay missing; displayed provisional points are normalized over categories with data. Saved snapshots preserve the score at that time.</p><button class="btn small" onclick="go('Settings & Data')">Configure weights →</button>`)}${card('Daily report',`<h3>${s.den?scoreLabel(s.points):'Start tracking to create your report'}</h3><p class="muted" style="font-size:12px">${reportText(s)}</p><div class="score-row"><span>Completed habits</span><b>${h.done}/${h.total}</b></div><div class="score-row"><span>Study</span><b>${study.toFixed(1)} hrs</b></div><div class="score-row"><span>Planned vs actual</span><b>${adherence(state.blocks[today()]||[])}% adherence</b></div>`,'wide')}</div>`}function reportText(s){if(!s.den)return 'Log activities through the day; your summary will use only saved entries.';let names=['routine','study/work','exercise','diet','sleep'];let pairs=s.earned.map((x,i)=>[x,i]).filter(x=>x[0]!==null).sort((a,b)=>b[0]/state.settings.weights[b[1]]-a[0]/state.settings.weights[a[1]]);return `Your ${s.complete?'final':'provisional'} score is ${s.points}/100. Strongest logged area: ${names[pairs[0][1]]}. ${pairs.length>1?'Next opportunity: '+names[pairs[pairs.length-1][1]]+'.':''} Tomorrow, choose one small adjustment based on your schedule.`}function finalizeScore(){let s=score();if(!s.den)return toast('Log at least one category first');state.settings.scores[today()]={points:s.points,weights:[...state.settings.weights],created:new Date().toISOString(),complete:s.complete};save();render();toast('Daily score snapshot saved')}
function diet(){let d=document.getElementById('mealdate')?.value||today(),meals=state.meals.filter(m=>m.date===d);return `<div class="section-head"><h2>Eat with awareness, without making tracking a chore</h2><div class="top-actions"><input id="mealdate" type="date" value="${d}" onchange="render()" style="width:auto"><button class="btn primary" onclick="openMeal()">＋ Log meal</button></div></div><div class="grid panelgrid">${card('Meals · '+fmt(d),meals.map(m=>`<div class="habit-item"><span class="tag">${esc(m.type)}</span><span class="habit-name"><b>${esc(m.items)}</b><span class="muted" style="display:block;font-size:10px">${esc(showTime(m.time)||'')} · ${esc(m.portion||'')} ${esc(m.unit||'')} ${m.notes?' · '+esc(m.notes):''}</span></span><span class="tag ${m.followed?'done':''}">${m.followed?'Plan followed':'Logged only'}</span><button class="icon-btn" onclick="deleteMeal('${m.id}')">×</button></div>`).join('')||'<div class="empty">Nothing logged yet. Food logging does not imply nutrition estimates.</div>', 'wide')}${card('Daily adherence',`<div class="stat-value">${Math.min(100,Math.round(mealDone(d)/3*100))}%</div><div class="bar"><i style="width:${Math.min(100,mealDone(d)/3*100)}%"></i></div><p class="muted" style="font-size:11px">${mealDone(d)} meals marked as following your plan. Meal logging and diet adherence are separate.</p>`)}${card('Quick foods',`<div class="quick">${state.foods.map(f=>`<button class="btn" onclick="openMeal('${esc(f)}')">＋ ${esc(f)}</button>`).join('')}</div><p class="muted" style="font-size:10px">Food values are not inferred. Add your own portions and notes.</p>`)}</div>`}function openMeal(food=''){modal('Log a meal',`<div class="formrow">${selectField('Meal','mtype',['Breakfast','Lunch','Evening snack','Dinner','Other meals'],'Breakfast')}${timeField('Meal time','mtime',new Date().toTimeString().slice(0,5))}</div><div class="formrow">${field('Food items','mitems','text',food,'placeholder="e.g. 2 roti, dal, sabzi"')}${field('Portion size','mportion','text','')}</div><div class="formrow">${field('Portion unit','munit','text','serving','placeholder="roti, katori, bowl, glass"')}</div><div class="formrow"><div class="field"><label>Notes</label><input id="mnotes"></div><label class="muted"><input id="mfollow" type="checkbox" style="width:auto"> Followed my planned diet</label></div><button class="btn primary" onclick="saveMeal()">Save meal</button>`)}function saveMeal(){let items=document.getElementById('mitems').value.trim();if(!items)return toast('Add a food item');state.meals.push({id:uid(),date:today(),type:document.getElementById('mtype').value,time:timeValue('mtime'),items,portion:document.getElementById('mportion').value,unit:document.getElementById('munit').value,notes:document.getElementById('mnotes').value,followed:document.getElementById('mfollow').checked});save();closeModal();render();toast('Meal saved')}function deleteMeal(id){state.meals=state.meals.filter(m=>m.id!==id);save();render()}
function workouts(){let d=document.getElementById('workdate')?.value||today(),ws=state.workouts.filter(w=>w.date===d);return `<div class="section-head"><h2>Training log</h2><div class="top-actions"><input id="workdate" type="date" value="${d}" onchange="render()" style="width:auto"><button class="btn primary" onclick="openWorkout()">＋ Log session</button></div></div><div class="grid panelgrid">${card('Sessions · '+fmt(d),ws.map(w=>`<div class="habit-item"><span class="tag">${esc(w.type)}</span><span class="habit-name"><b>${esc(w.name||w.type)}</b><span class="muted" style="display:block;font-size:10px">${w.duration||0} min${w.distance?` · ${w.distance} km · pace ${w.pace} min/km`:''}${w.sets?` · ${w.sets} × ${w.reps} reps`:''}${w.notes?' · '+esc(w.notes):''}</span></span><span class="tag ${w.status==='Completed'?'done':''}">${w.status}</span><button class="icon-btn" onclick="deleteWorkout('${w.id}')">×</button></div>`).join('')||'<div class="empty">No sessions logged on this date.</div>','wide')}${card('This week',weeklyWorkoutStats())}${card('Exercise library',`<div class="quick">${['Push-ups','Squats','Lunges','Planks','Rows','Overhead press','Biceps curls','Triceps'].map(x=>`<button class="btn" onclick="openWorkout('${x}')">${x}</button>`).join('')}</div><p class="muted" style="font-size:10px">Only log equipment you use; the tracker does not assume gym access.</p>`)}</div>`}function weeklyWorkoutStats(){let dist=0,min=0,n=0;for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);let k=dateKey(d);state.workouts.filter(w=>w.date===k&&w.status==='Completed').forEach(w=>{n++;min+=+w.duration||0;dist+=+w.distance||0})}return `<div class="score-row"><span>Sessions</span><b>${n}</b></div><div class="score-row"><span>Running distance</span><b>${dist.toFixed(1)} km</b></div><div class="score-row"><span>Exercise duration</span><b>${min} min</b></div>`}function openWorkout(name=''){modal('Log workout or run',`<div class="formrow">${selectField('Session type','wtype',['Workout','Running','Recovery','Rest day'],'Workout')}${field('Exercise / run type','wname','text',name)}</div><div class="formrow">${field('Duration (min)','wduration','number','')}${field('Distance (km)','wdistance','number','','step="0.01"')}${field('Perceived effort (1–10)','weffort','number','','min="1" max="10"')}</div><div class="formrow">${field('Sets','wsets','number','')}${field('Reps','wreps','number','')}${field('Weight (kg)','wweight','number','','step="0.5"')}</div><div class="formrow">${field('Notes','wnotes')}</div><button class="btn primary" onclick="saveWorkout()">Save session</button>`)}function saveWorkout(){let type=document.getElementById('wtype').value,dur=+document.getElementById('wduration').value||0,dist=+document.getElementById('wdistance').value||0;if(type==='Running'&&dist&&dur===0)return toast('Enter duration to calculate pace');state.workouts.push({id:uid(),date:today(),type,name:document.getElementById('wname').value||type,duration:dur,distance:dist,pace:dist&&dur?(dur/60/dist).toFixed(2):null,effort:document.getElementById('weffort').value,sets:document.getElementById('wsets').value,reps:document.getElementById('wreps').value,weight:document.getElementById('wweight').value,notes:document.getElementById('wnotes').value,status:'Completed'});save();closeModal();render();toast('Session saved')}function deleteWorkout(id){state.workouts=state.workouts.filter(w=>w.id!==id);save();render()}
function study(){let d=document.getElementById('taskdate')?.value||today(),ts=state.tasks.filter(t=>t.date===d);return `<div class="section-head"><h2>Focus on what matters</h2><div class="top-actions"><input id="taskdate" type="date" value="${d}" onchange="render()" style="width:auto"><button class="btn primary" onclick="openTask()">＋ Add task</button></div></div><div class="grid panelgrid">${card('Tasks · '+fmt(d),ts.map(t=>`<div class="habit-item"><button class="check ${t.status==='Done'?'done':''}" onclick="toggleTask('${t.id}')">${t.status==='Done'?'✓':''}</button><span class="habit-name"><b>${esc(t.title)}</b><span class="muted" style="display:block;font-size:10px">${esc(t.category)} · ${t.actual||0} / ${t.estimate||0} hrs${t.deadline?' · due '+t.deadline:''}</span></span><span class="tag">${t.priority}</span><button class="icon-btn" onclick="deleteTask('${t.id}')">×</button></div>`).join('')||'<div class="empty">No planned tasks. Add tasks; unplanned tasks are not treated as missed.</div>','wide')}${card('Study time today',`<div class="stat-value">${studyHours(d).toFixed(1)} <span class="muted" style="font-size:14px">hrs</span></div><div class="muted" style="font-size:11px">Target ${state.settings.studyTarget} hours</div>`)}${card('Focus timer',`<div class="stat-value mono" id="timerDisplay">25:00</div><div class="formrow">${selectField('Session','timermode',['Pomodoro · 25 min','Short focus · 15 min','Deep work · 50 min'],'Pomodoro · 25 min')}</div><button class="btn primary" id="timerBtn" onclick="timerToggle()">Start focus</button> <button class="btn" onclick="timerReset()">Reset</button><p class="muted" style="font-size:10px">Timer runs in this page session; record completed time in a task.</p>`)}</div>`}function openTask(){modal('Add a study or work task',`<div class="formrow">${field('Task title','ttitle')}${field('Subject / category','tcat','text','Study')}</div><div class="formrow">${selectField('Priority','tpriority',['Low','Medium','High'],'Medium')}${field('Estimated hours','testimate','number','','step="0.25"')}${field('Actual hours','tactual','number','','step="0.25"')}</div><div class="formrow">${field('Deadline','tdeadline','date','')}</div><button class="btn primary" onclick="saveTask()">Save task</button>`)}function saveTask(){let title=document.getElementById('ttitle').value.trim();if(!title)return toast('Enter a task title');state.tasks.push({id:uid(),date:today(),title,category:document.getElementById('tcat').value,priority:document.getElementById('tpriority').value,estimate:+document.getElementById('testimate').value||0,actual:+document.getElementById('tactual').value||0,deadline:document.getElementById('tdeadline').value,status:'Planned'});save();closeModal();render()}function toggleTask(id){let t=state.tasks.find(x=>x.id===id);t.status=t.status==='Done'?'Planned':'Done';save();render()}function deleteTask(id){state.tasks=state.tasks.filter(t=>t.id!==id);save();render()}let timer=null,timerSec=1500,timerRun=false;function timerToggle(){if(timerRun){clearInterval(timer);timerRun=false;document.getElementById('timerBtn').textContent='Resume focus'}else{if(timerSec===1500){let s=document.getElementById('timermode')?.value||'';timerSec=s.includes('15 min')?900:s.includes('50 min')?3000:1500}timerRun=true;timer=setInterval(()=>{timerSec--;let e=document.getElementById('timerDisplay');if(e)e.textContent=`${String(Math.floor(timerSec/60)).padStart(2,'0')}:${String(timerSec%60).padStart(2,'0')}`;if(timerSec<=0){clearInterval(timer);timerRun=false;toast('Focus session complete!')}},1000);document.getElementById('timerBtn').textContent='Pause focus'}}function timerReset(){clearInterval(timer);timerRun=false;timerSec=1500;let e=document.getElementById('timerDisplay');if(e)e.textContent='25:00';let b=document.getElementById('timerBtn');if(b)b.textContent='Start focus'}
function sleep(){let d=document.getElementById('sleepdate')?.value||today(),s=state.sleeps.find(x=>x.date===d);return `<div class="section-head"><h2>Recovery is part of the plan</h2><input id="sleepdate" type="date" value="${d}" onchange="render()" style="width:auto"></div><div class="grid panelgrid"><section class="card"><h2>${s?'Edit':'Log'} sleep · ${fmt(d)}</h2><div class="formrow">${timeField('Bedtime','sbed',s?.bed||'22:00')}${timeField('Wake-up time','swake',s?.wake||'06:00')}</div><div class="formrow">${field('Sleep quality (1–5)','squality','number',s?.quality||'','min="1" max="5"')}${field('Notes','snotes','text',s?.notes||'')}</div><button class="btn primary" onclick="saveSleep('${d}')">Save sleep log</button><p class="muted" style="font-size:10px">Duration is calculated across midnight. This is a personal estimate, not a medical measurement.</p></section>${card('Sleep target',`<div class="stat-value">${s?.duration||'—'} <span class="muted" style="font-size:14px">/ ${state.settings.sleepTarget} hrs</span></div><div class="bar"><i style="width:${Math.min(100,(s?.duration||0)/state.settings.sleepTarget*100)}%"></i></div>`)}${card('Recent nights',state.sleeps.slice(-7).reverse().map(x=>`<div class="score-row"><span>${x.date}</span><b>${x.duration} hrs · quality ${x.quality||'—'}/5</b></div>`).join('')||'<div class="empty">Log sleep to see trends</div>')}</div>`}function saveSleep(d){let bed=timeValue('sbed'),wake=timeValue('swake');if(!bed||!wake)return toast('Enter bedtime and wake-up time');let [bh,bm]=bed.split(':').map(Number),[wh,wm]=wake.split(':').map(Number),dur=((wh*60+wm)-(bh*60+bm)+1440)%1440/60;if(dur===0)dur=24;let obj={date:d,bed,wake,duration:+dur.toFixed(2),quality:+document.getElementById('squality').value||null,notes:document.getElementById('snotes').value};let i=state.sleeps.findIndex(x=>x.date===d);if(i>=0)state.sleeps[i]=obj;else state.sleeps.push(obj);save();render();toast('Sleep log saved')}
function analytics(){let range=document.getElementById('range')?.value||'7',days=range==='30'?30:range==='month'?new Date().getDate():+range,arr=[];for(let i=days-1;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=dateKey(d);if(dayHasData(k))arr.push({date:k,score:dayScore(k),study:studyHours(k),habits:habitCounts(k)})}let avg=arr.length?Math.round(arr.reduce((a,x)=>a+x.score,0)/arr.length):0;let chart=arr.slice(-14).map(x=>`<div class="col"><span class="value">${x.score}</span><div class="stick" style="height:${Math.max(4,x.score)}%"></div><span class="day">${x.date.slice(5)}</span></div>`).join('');return `<div class="section-head"><h2>Patterns from your saved records</h2><select id="range" onchange="render()" style="width:auto"><option value="7" ${range==='7'?'selected':''}>Last 7 days</option><option value="30" ${range==='30'?'selected':''}>Last 30 days</option><option value="month" ${range==='month'?'selected':''}>This month</option></select></div><div class="grid stats"><div class="card stat"><div class="stat-label">Days with data</div><div class="stat-value">${arr.length}</div></div><div class="card stat"><div class="stat-label">Average score</div><div class="stat-value">${arr.length?avg:'—'}</div></div><div class="card stat"><div class="stat-label">Study hours</div><div class="stat-value">${arr.reduce((a,x)=>a+x.study,0).toFixed(1)}</div></div><div class="card stat"><div class="stat-label">Habit completion</div><div class="stat-value">${arr.length?Math.round(arr.reduce((a,x)=>a+(x.habits.total?x.habits.done/x.habits.total:0),0)/arr.length*100):'—'}%</div></div></div><div class="grid panelgrid">${card('Daily score trend',arr.length?`<div class="bars">${chart}</div>`:'<div class="empty">No historical entries for this period. Start logging to build your charts.</div>','wide')}${card('Weekly review',weeklyReview(arr))}${card('History',arr.length?`<table class="table"><thead><tr><th>Date</th><th>Score</th><th>Study</th><th>Habits</th></tr></thead><tbody>${arr.slice().reverse().map(x=>`<tr><td>${fmt(x.date)}</td><td>${x.score}</td><td>${x.study.toFixed(1)} hrs</td><td>${x.habits.done}/${x.habits.total}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Saved dates will appear here.</div>','wide')}</div>`}function weeklyReview(arr){if(!arr.length)return '<div class="empty">Log some days to generate a review.</div>';let first=arr[0],last=arr[arr.length-1],best=arr.reduce((a,b)=>a.score>b.score?a:b),worst=arr.reduce((a,b)=>a.score<b.score?a:b),hours=arr.reduce((a,x)=>a+x.study,0);return `<div class="score-row"><span>What went well</span><b>Best score ${best.score} on ${best.date}</b></div><div class="score-row"><span>Consistency</span><b>${arr.length} tracked days</b></div><div class="score-row"><span>Study time</span><b>${hours.toFixed(1)} hours</b></div><div class="score-row"><span>Opportunity</span><b>Review ${worst.date} (${worst.score})</b></div><p class="muted" style="font-size:11px">Your available-period average is ${Math.round(arr.reduce((a,x)=>a+x.score,0)/arr.length)}. Next week, choose a realistic study target and protect a small workout slot.</p>`}
function goals(){let list=state.goals||[];return `<div class="section-head"><h2>Set intentions. Celebrate proven progress.</h2><button class="btn primary" onclick="openGoal()">＋ Add goal</button></div><div class="grid panelgrid">${card('Your goals',list.map(g=>`<div class="habit-item"><span class="habit-name"><b>${esc(g.name)}</b><span class="muted" style="display:block;font-size:10px">${esc(g.period)} · target ${g.target} ${esc(g.unit)}</span></span><span class="tag">${goalProgress(g)}</span><button class="icon-btn" onclick="deleteGoal('${g.id}')">×</button></div>`).join('')||'<div class="empty">No goals yet. Add a goal to track progress from real records.</div>','wide')}${card('Earned milestones',`<div class="habit-item"><span class="tag ${calcStreak()>=7?'done':''}">${calcStreak()>=7?'Earned':'In progress'}</span><span class="habit-name">Seven-day tracking streak</span></div><div class="habit-item"><span class="tag ${calcStreak()>=30?'done':''}">${calcStreak()>=30?'Earned':'In progress'}</span><span class="habit-name">Thirty-day tracking streak</span></div><p class="muted" style="font-size:10px">Milestones unlock only when consecutive saved daily records support them.</p>`)}</div>`}function openGoal(){modal('Create a personal goal',`<div class="formrow">${field('Goal name','gname')}${selectField('Measure','gmetric',['Study hours','Workout sessions','Running distance','Habit completion','Sleep duration','Daily marks','Diet adherence'],'Study hours')}</div><div class="formrow">${field('Target','gtarget','number','','step="0.1"')}${selectField('Period','gperiod',['Daily','Weekly','Monthly'],'Weekly')}${field('Unit','gunit','text','hours')}</div><button class="btn primary" onclick="saveGoal()">Save goal</button>`)}function saveGoal(){let name=document.getElementById('gname').value.trim();if(!name)return toast('Enter a goal name');state.goals.push({id:uid(),name,metric:document.getElementById('gmetric').value,target:+document.getElementById('gtarget').value||0,period:document.getElementById('gperiod').value,unit:document.getElementById('gunit').value});save();closeModal();render()}function goalProgress(g){let v=0;if(g.metric==='Study hours')v=studyHours();if(g.metric==='Workout sessions')v=state.workouts.filter(w=>w.date>=today()&&w.status==='Completed').length;if(g.metric==='Running distance')v=state.workouts.filter(w=>w.date===today()).reduce((s,w)=>s+(+w.distance||0),0);if(g.metric==='Daily marks')v=score().points;return `${v} / ${g.target} ${g.unit}`}function deleteGoal(id){state.goals=state.goals.filter(g=>g.id!==id);save();render()}
function settings(){let w=state.settings.weights;return `<div class="grid panelgrid"><section class="card"><h2>Scoring and targets</h2><p class="muted" style="font-size:11px">Weights must add to 100. Existing saved daily snapshots keep their original weights.</p><div class="formrow">${['Routine & habits','Study & work','Exercise','Diet','Sleep'].map((x,i)=>field(x,`weight${i}`,'number',w[i],'min="0" max="100"')).join('')}</div><div class="formrow">${field('Study target (hours)','studytarget','number',state.settings.studyTarget,'step="0.5"')}${field('Sleep target (hours)','sleeptarget','number',state.settings.sleepTarget,'step="0.5"')}${selectField('Time interval','interval',['15','30','60'],String(state.settings.interval))}${selectField('Time display','timeformat',['12-hour','24-hour'],(state.settings.timeFormat||'12')==='24'?'24-hour':'12-hour')}</div><button class="btn primary" onclick="saveSettings()">Save settings</button></section>${card('Score labels',`<div class="score-row"><span>90–100</span><b>Excellent</b></div><div class="score-row"><span>75–89</span><b>Good</b></div><div class="score-row"><span>60–74</span><b>Needs improvement</b></div><div class="score-row"><span>40–59</span><b>Poor</b></div><div class="score-row"><span>Below 40</span><b>Reset and improve tomorrow</b></div><p class="muted" style="font-size:10px">Labels are fixed for now; category weights and targets are editable.</p>`)}${card('Backup & data',`<p class="muted" style="font-size:11px">Your records stay in this browser on this device. Export a JSON backup regularly if you want an external copy.</p><div class="quick"><button class="btn" onclick="exportJSON()">Export JSON backup</button><button class="btn" onclick="exportCSV()">Export CSV</button><label class="btn" style="text-align:center">Restore backup<input type="file" accept="application/json" onchange="importJSON(event)" hidden></label><button class="btn" onclick="clearData()">Clear all data</button></div><p class="muted" style="font-size:10px">No cloud synchronization is configured. Meal photos are not stored in this version.</p>`,'wide')}${card('Privacy',`<div class="localdot"></div><span>All tracking data is stored in browser local storage. Nothing is sent to a server.</span><p class="muted" style="font-size:11px">Clearing browser site data removes your records; keep an exported backup to restore them.</p>`)}</div>`}function saveSettings(){let weights=[0,1,2,3,4].map(i=>+document.getElementById('weight'+i).value||0);if(weights.reduce((a,b)=>a+b,0)!==100)return toast('Weights must add up to exactly 100');state.settings.weights=weights;state.settings.studyTarget=+document.getElementById('studytarget').value||4;state.settings.sleepTarget=+document.getElementById('sleeptarget').value||8;state.settings.interval=+document.getElementById('interval').value;state.settings.timeFormat=document.getElementById('timeformat').value==='24-hour'?'24':'12';save();render();toast('Settings saved')}function exportJSON(){let blob=new Blob([JSON.stringify({app:'LifeOS',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});download(blob,'lifeos-backup-'+today()+'.json')}function exportCSV(){let rows=[['date','type','name','details']];Object.entries(state.checks).forEach(([d,c])=>Object.entries(c).forEach(([id,v])=>rows.push([d,'habit',state.habits.find(h=>h.id===id)?.name||id,v.done?'completed':'missed'])));state.meals.forEach(m=>rows.push([m.date,'meal',m.items,`${m.type}; ${m.followed?'followed':'logged'}`]));state.workouts.forEach(w=>rows.push([w.date,w.type,w.name,`${w.duration} min; ${w.distance} km; pace ${w.pace||''}`]));state.tasks.forEach(t=>rows.push([t.date,'task',t.title,`${t.status}; ${t.actual} hours`]));Object.keys(state.blocks).forEach(d=>state.blocks[d].forEach(b=>rows.push([d,'time block',b.activity,`${b.start}-${b.end}; ${b.category}; ${b.status}`])));download(new Blob([rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'}),'lifeos-export-'+today()+'.csv')}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result),d=v.data||v;if(!d.habits||!d.settings)throw Error();if(!confirm('Replace current LifeOS data with this backup?'))return;state=d;save();render();toast('Backup restored')}catch{toast('Could not read this LifeOS backup')}};r.readAsText(f)}function clearData(){if(confirm('Delete all LifeOS records from this browser? This cannot be undone unless you have a backup.')){localStorage.removeItem(KEY);state=fresh();save();render();toast('Local data cleared')}}
function saveInitial(){save()}drawNav();render();
</script><script src="advanced.js"></script><script src="ultimate.js"></script></body></html>
